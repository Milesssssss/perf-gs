name: Host-shader contracts

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  generated-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Reject stale generated artifacts
        run: python -m trainer.contracts --check
      - name: Run CPU contract tests
        run: python -m pytest tests/test_contracts.py -k "not gaussian_struct_size_matches_contract" -q

  # GPU reflection requires a Vulkan or D3D12 adapter and remains part of the
  # local/backend test matrix. The CPU job above still enforces schema derivation,
  # generated-file staleness, and host-side layout/offset invariants on every PR.
